name: tests

on:
  pull_request:
    branches:
      - nx2
      - nx2-experimental
  push:
    branches:
      - nx2
      - nx2-experimental
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "tools/windows/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (windows-x86_64)
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .sccache
          key: tests-objects-windows-x86_64-${{ github.sha }}
          restore-keys: |
            tests-objects-windows-x86_64-

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/tests -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DYUZU_TESTS=ON
          -DDYNARMIC_TESTS=ON
          -DENABLE_QT=OFF
          -DYUZU_CMD=OFF
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_WEB_SERVICE=OFF
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DENABLE_WERROR=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: bash
        run: |
          cmake --build build/tests --target tests dynarmic_tests --parallel
          sccache --show-stats

      - name: Run tests
        shell: bash
        run: build/tests/bin/tests.exe --reporter console --durations yes

      - name: Run dynarmic tests
        shell: bash
        run: build/tests/bin/dynarmic_tests.exe --durations yes

  macos:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssl: system
            bundled_openssl: 'OFF'
            name: macOS graphics and HTTPS regressions (arm64)
          - openssl: bundled
            bundled_openssl: 'ON'
            name: macOS graphics and HTTPS regressions (arm64, bundled OpenSSL)
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install autoconf automake boost ccache cmake ffmpeg fmt glslang \
            libtool libusb lz4 ninja nlohmann-json openssl@3 pkgconf sdl3 \
            speexdsp zlib zstd

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts
          cache: true

      - name: Cache dependencies and compiler objects
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            .ccache
          key: macos-tests-${{ matrix.openssl }}-${{ hashFiles('cpmfile.json') }}-${{ github.sha }}
          restore-keys: |
            macos-tests-${{ matrix.openssl }}-${{ hashFiles('cpmfile.json') }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: >-
          cmake -S . -B build/tests -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DYUZU_TESTS=ON -DDYNARMIC_TESTS=OFF
          -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix)"
          "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
          -DYUZU_USE_BUNDLED_OPENSSL=${{ matrix.bundled_openssl }}
          -DYUZU_USE_BUNDLED_SDL3=OFF -DYUZU_USE_BUNDLED_MOLTENVK=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DYUZU_CMD=OFF -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF
          -DENABLE_WEB_SERVICE=OFF -DENABLE_UPDATE_CHECKER=ON
          "-DEGLANTINE_UPDATE_REPO=$GITHUB_REPOSITORY"
          -DUSE_DISCORD_PRESENCE=OFF -DENABLE_WERROR=OFF -DUSE_CCACHE=ON

      - name: Verify the requested OpenSSL configuration is active
        env:
          EXPECT_BUNDLED_OPENSSL: ${{ matrix.bundled_openssl }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          entries = json.loads(Path('build/tests/compile_commands.json').read_text())
          request = next(entry for entry in entries
                         if entry['file'].endswith('/src/common/net/net.cpp'))
          arguments = shlex.split(request['command'])
          bundled = any(arg == '-DYUZU_BUNDLED_OPENSSL' or
                        arg.startswith('-DYUZU_BUNDLED_OPENSSL=') for arg in arguments)
          expected = os.environ['EXPECT_BUNDLED_OPENSSL'] == 'ON'
          if bundled != expected:
              raise SystemExit(f'Wrong OpenSSL configuration: bundled={bundled}, expected={expected}')
          print(f'Confirmed bundled OpenSSL: {bundled}')
          PY

      - name: Build application and regression tests
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build/tests --target yuzu tests configuration_tests --parallel 2

      - name: Run graphics and layout regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/tests/bin/tests '[vulkan]' --reporter console
          ctest --test-dir build/tests -R '^configuration_tests$' --output-on-failure

      - name: Check GitHub HTTPS without Homebrew certificate files
        env:
          SSL_CERT_FILE: /dev/null
          SSL_CERT_DIR: /nonexistent-eglantine-ca-directory
        run: build/tests/bin/tests '[network]' --reporter console

      - name: Reject distrusted and restricted macOS roots, including redirects
        run: >-
          python3 tools/macos/test_https_trust.py build/tests/bin/tests
          --openssl "$(brew --prefix openssl@3)/bin/openssl"
