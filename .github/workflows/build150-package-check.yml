name: Build 150 portable package native startup check
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build150 Windows PGO workflow run ID
        type: string
        required: true
      source_ref:
        description: Branch containing package validation scripts
        type: string
        default: test/build150-pgo-warmup
permissions:
  contents: read
  actions: read
jobs:
  native-startup:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Download original runnable package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: lichii-build150-windows-x64-pgo-warmup-*
          path: package
          merge-multiple: true
      - name: Download build evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: build150-pgo-warmup-evidence-*
          path: .
          merge-multiple: true
      - name: Bundle app-local Microsoft runtime
        shell: pwsh
        run: |
          $crt = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022/*/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT' -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft redistributable runtime directory missing' }
          Copy-Item "$($crt.FullName)/*.dll" package/ -Force
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "package/$dll")) { throw "Missing app-local $dll" }
          }
      - name: Verify PE architecture, feature presence and portable isolation
        shell: pwsh
        run: python tools/windows/warmup-test/verify-package.py
      - name: Report effective flags and profile exclusions
        shell: pwsh
        run: |
          python tools/windows/warmup-test/audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Optimisation audit failed' }
          Get-Content evidence/profile-mismatch-summary.json
          Get-Content evidence/compiler.txt
          Get-Content evidence/ctest.log | Select-Object -Last 25
      - name: Start the native GUI using only package and system dependencies
        shell: pwsh
        run: ./tools/windows/warmup-test/native-smoke.ps1
      - name: Add build and runtime evidence to the portable package
        shell: pwsh
        run: |
          @(
            'Compiled source commit:'
            (Get-Content evidence/build-commit.txt)
            'Training profile Git blob (unchanged):'
            (Get-Content evidence/profile-blob.txt)
            (Get-Content evidence/compiler.txt)
            (Get-Content evidence/optimisation-audit.txt)
            (Get-Content evidence/native-runtime-smoke.txt)
            'Shared GPU shader functions default to calls, not inlined. GPU gameplay and performance remain unverified.'
          ) | Set-Content package/BUILD-INFO.txt
          $readme = Get-Content package/README-TEST.txt -Raw
          $readme.Replace('choose Prepare shaders before the game starts.', 'choose Precache shaders before game start.').Replace('Prepare shaders (warm-up).', 'Build Shader Precache (or Rebuild Shader Precache).') | Set-Content package/README-TEST.txt
          Get-ChildItem package -Recurse -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $([IO.Path]::GetRelativePath((Resolve-Path package), $_.FullName))"
          } | Set-Content evidence/final-package-sha256.txt
      - name: Upload verified portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lichii-build150-windows-x64-pgo-warmup-verified-${{ github.run_id }}
          path: package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native startup and corrected optimisation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build150-native-package-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 14
